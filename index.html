<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幣安合約 PRO 篩選器</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600;700&family=IBM+Plex+Sans+TC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f4f8;--bg2:#e8edf3;--panel:#dde4ed;
  --border:#c8d3df;--bdr2:#b0bfcf;
  --long:#007a52;--short:#cc1133;--watch:#b86b00;--neu:#1a5fc8;
  --text:#2a3a4a;--texthi:#0a1520;--textlo:#7a90a8;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans TC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:48px 48px;opacity:.35;pointer-events:none;z-index:0;}

header{position:sticky;top:0;z-index:200;background:#f0f4f8ee;
  backdrop-filter:blur(14px);border-bottom:1px solid var(--bdr2);
  display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;}
.hlogo{font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--neu);
  letter-spacing:2px;flex-shrink:0;}
.hlogo em{color:var(--textlo);font-style:normal;}
.hticker{flex:1;overflow:hidden;white-space:nowrap;font-family:var(--mono);
  font-size:.56rem;color:var(--textlo);
  mask-image:linear-gradient(90deg,transparent,black 10%,black 90%,transparent);}
.hlive{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--textlo);
  animation:blip 1.8s ease-in-out infinite;}
@keyframes blip{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.65);}}
.ltxt{font-family:var(--mono);font-size:.58rem;color:var(--textlo);letter-spacing:1px;}

.tabs{display:flex;border-bottom:1px solid var(--bdr2);background:var(--bg2);}
.tab{flex:1;padding:11px 4px;font-family:var(--mono);font-size:.58rem;
  color:var(--textlo);cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;transition:all .2s;text-align:center;}
.tab.t-all.on{color:var(--neu);border-color:var(--neu);}
.tab.t-long.on{color:var(--long);border-color:var(--long);}
.tab.t-short.on{color:var(--short);border-color:var(--short);}
.tab.t-watch.on{color:var(--watch);border-color:var(--watch);}
.tab.t-ga.on{color:#007a52;border-color:#007a52;}
.tab.t-gb.on{color:#1a5fc8;border-color:#1a5fc8;}
.tab.t-gc.on{color:#b86b00;border-color:#b86b00;}

.scanbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--border);}
.sb-label{font-family:var(--mono);font-size:.56rem;color:var(--textlo);}
select{background:var(--bg2);border:1px solid var(--bdr2);color:var(--text);
  font-family:var(--mono);font-size:.6rem;padding:5px 7px;border-radius:3px;cursor:pointer;}
.prog-wrap{flex:1;min-width:50px;height:2px;background:var(--bdr2);border-radius:1px;overflow:hidden;}
.prog-fill{height:100%;background:var(--long);width:0%;transition:width .3s;}
.prog-txt{font-family:var(--mono);font-size:.54rem;color:var(--textlo);white-space:nowrap;}
.scan-btn{padding:7px 14px;border-radius:3px;border:1px solid var(--long);
  background:#00f0a010;color:var(--long);font-family:var(--mono);font-size:.65rem;
  letter-spacing:1px;cursor:pointer;white-space:nowrap;}
.scan-btn:active{background:#00f0a025;}
.scan-btn:disabled{opacity:.35;cursor:not-allowed;}

.statrow{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border);}
.sc{padding:10px 6px;border-right:1px solid var(--border);text-align:center;}
.sc:nth-child(3n){border-right:none;}
.sc:nth-child(n+4){border-top:1px solid var(--border);}
.sc-val{font-family:var(--mono);font-size:1.15rem;font-weight:700;}
.sc-lbl{font-size:.5rem;letter-spacing:1px;color:var(--textlo);margin-top:2px;}
.c-long{color:var(--long);}
.c-short{color:var(--short);}
.c-watch{color:var(--watch);}

.errbox{margin:10px 14px;padding:10px;background:#ff335508;
  border:1px solid #ff335530;border-radius:3px;font-family:var(--mono);
  font-size:.62rem;color:var(--short);display:none;}
.ts{padding:5px 14px;font-family:var(--mono);font-size:.53rem;color:var(--textlo);border-bottom:1px solid var(--border);}

.sortbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;
  background:var(--bg2);border-bottom:1px solid var(--border);align-items:center;}
.sort-lbl{font-family:var(--mono);font-size:.53rem;color:var(--textlo);}
.sort-btn{font-family:var(--mono);font-size:.55rem;padding:4px 10px;
  border-radius:4px;border:1px solid var(--border);background:var(--bg);
  color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;}
.sort-btn:active{opacity:.7;}
.sort-btn.active{border-color:var(--neu);color:var(--neu);background:#1a5fc812;font-weight:600;}

/* GRADE FILTER */
.gradebar{display:flex;gap:6px;flex-wrap:wrap;padding:7px 14px;
  background:var(--bg2);border-bottom:1px solid var(--border);align-items:center;}
.gf-lbl{font-family:var(--mono);font-size:.53rem;color:var(--textlo);}
.gf-btn{font-family:var(--mono);font-size:.6rem;padding:4px 14px;
  border-radius:10px;border:2px solid var(--border);background:transparent;
  color:var(--textlo);cursor:pointer;font-weight:600;white-space:nowrap;transition:all .15s;}
.gf-btn:active{opacity:.7;}
.gf-btn.gf-on-all {border-color:var(--neu);color:var(--neu);background:#1a5fc815;}
.gf-btn.gf-on-a   {border-color:var(--long);color:var(--long);background:#007a5215;}
.gf-btn.gf-on-b   {border-color:var(--neu);color:var(--neu);background:#1a5fc815;}
.gf-btn.gf-on-c   {border-color:var(--watch);color:var(--watch);background:#b86b0015;}

.emabar{display:flex;gap:6px;flex-wrap:wrap;padding:7px 14px;
  background:var(--bg);border-bottom:1px solid var(--border);align-items:center;}
.ema-flbl{font-family:var(--mono);font-size:.53rem;color:var(--textlo);}
.ema-fbtn{font-family:var(--mono);font-size:.53rem;padding:3px 10px;
  border-radius:10px;border:1px solid var(--border);background:transparent;
  color:var(--textlo);cursor:pointer;transition:all .15s;white-space:nowrap;}
.ema-fbtn:active{opacity:.7;}
.ema-fbtn.ef-all   {border-color:var(--neu);color:var(--neu);background:#1a5fc818;}
.ema-fbtn.ef-above {border-color:var(--long);color:var(--long);background:#007a5215;}
.ema-fbtn.ef-below {border-color:var(--short);color:var(--short);background:#cc113315;}
.ema-fbtn.ef-between{border-color:var(--watch);color:var(--watch);background:#b86b0015;}

.cardlist{padding:0 0 60px;overflow:hidden;width:100%;}
.load-state{padding:70px;text-align:center;color:var(--textlo);
  font-family:var(--mono);font-size:.7rem;letter-spacing:2px;}
.spin{display:inline-block;animation:sp 1s linear infinite;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg);}}
.empty{padding:50px;text-align:center;color:var(--textlo);}

.coin-card{border-bottom:1px solid var(--border);padding:11px 14px 11px 16px;
  cursor:pointer;animation:frow .22s ease both;
  width:100%;overflow:hidden;box-sizing:border-box;position:relative;}
.coin-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:transparent;transition:background .15s;}
@keyframes frow{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.coin-card:active{background:#00000008;}
.coin-card.row-long::before{background:var(--long);}
.coin-card.row-short::before{background:var(--short);}
.coin-card.row-watch::before{background:var(--watch);}

/* card-top: 幣名+價格一行，信號badge獨立右側 */
.card-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:5px;width:100%;}
.card-top-left{display:flex;align-items:center;gap:6px;flex:1;flex-wrap:wrap;min-width:0;}
.card-sym{font-family:var(--mono);font-weight:700;color:var(--texthi);font-size:.84rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.card-sym sub{color:var(--textlo);font-weight:400;font-size:.52rem;vertical-align:baseline;}
.card-price{font-family:var(--mono);font-size:.72rem;color:var(--text);white-space:nowrap;}
.card-chg{font-family:var(--mono);font-size:.7rem;white-space:nowrap;}
.pos{color:var(--long);}
.neg{color:var(--short);}
.sig{display:inline-flex;align-items:center;padding:3px 9px;border-radius:2px;
  font-family:var(--mono);font-size:.58rem;letter-spacing:1px;font-weight:700;
  border:1px solid;flex-shrink:0;white-space:nowrap;}
.sig-long{color:var(--long);border-color:#00f0a055;background:#00f0a012;}
.sig-short{color:var(--short);border-color:#ff335555;background:#ff335512;}
.sig-watch{color:var(--watch);border-color:#ffaa0055;background:#ffaa0012;}
.sig-none{color:var(--textlo);border-color:var(--border);background:transparent;}

/* EMA STATUS ROW */
.ema-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.ema-pill{font-family:var(--mono);font-size:.54rem;padding:2px 8px;border-radius:10px;
  border:1px solid;font-weight:600;}
.ep-above{color:var(--long);border-color:#007a5260;background:#007a520f;}
.ep-below{color:var(--short);border-color:#cc113360;background:#cc11330f;}
.ep-mid{color:var(--watch);border-color:#b86b0060;background:#b86b000f;}
/* EMA distance — now bigger and coloured */
.ema-dist-row{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.ema-dist-tag{font-family:var(--mono);font-size:.7rem;font-weight:600;
  padding:2px 10px;border-radius:4px;border:1px solid;}
.edt-pos{color:var(--long);border-color:#007a5240;background:#007a520c;}
.edt-neg{color:var(--short);border-color:#cc113340;background:#cc11330c;}

.score-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.gbar{flex:1;height:3px;border-radius:2px;background:var(--border);overflow:hidden;}
.gfill{height:100%;border-radius:2px;transition:width .5s;}
.gfill-long{background:var(--long);}
.gfill-short{background:var(--short);}
.gfill-watch{background:var(--watch);}
.gnum{font-family:var(--mono);font-size:.56rem;color:var(--textlo);white-space:nowrap;}

.chips{display:flex;gap:4px;flex-wrap:wrap;}
.chip{font-family:var(--mono);font-size:.52rem;padding:2px 6px;border-radius:2px;border:1px solid;white-space:nowrap;}
.chip-long{color:var(--long);border-color:#007a5250;background:#007a520d;}
.chip-short{color:var(--short);border-color:#cc113350;background:#cc11330d;}
.chip-watch{color:var(--watch);border-color:#b86b0050;background:#b86b000d;}
.chip-neu{color:var(--textlo);border-color:var(--border);background:transparent;}

/* DETAIL */
.card-detail{display:none;margin-top:10px;padding:10px 11px;
  background:var(--bg2);border:1px solid var(--bdr2);border-radius:4px;
  overflow:hidden;}
.coin-card.expanded .card-detail{display:block;}
.dtitle{font-family:var(--mono);font-size:.54rem;color:var(--textlo);
  letter-spacing:1.5px;margin-bottom:7px;margin-top:10px;padding-top:8px;
  border-top:1px solid var(--border);}
.dtitle:first-child{margin-top:0;padding-top:0;border-top:none;}

/* 三欄格 → 手機改兩欄 */
.ema-detail{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:4px;}
/* 若螢幕夠寬才用三欄 */
@media(min-width:480px){.ema-detail{grid-template-columns:repeat(3,1fr);}}

.edb{padding:8px 10px;border-radius:4px;border:1px solid var(--border);background:var(--bg);min-width:0;}
.edb-lbl{font-family:var(--mono);font-size:.5rem;color:var(--textlo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.edb-val{font-family:var(--mono);font-size:.78rem;font-weight:700;margin-top:3px;word-break:break-all;}
.edb-sub{font-family:var(--mono);font-size:.46rem;margin-top:3px;line-height:1.4;color:var(--textlo);}
.ev-long{color:var(--long);}
.ev-short{color:var(--short);}
.ev-neu{color:var(--texthi);}

/* 進場兩欄 */
.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px;}
.ebox{padding:10px 10px;border-radius:4px;border:1px solid;min-width:0;}
.ebox-l{border-color:#007a5230;background:#007a5208;}
.ebox-s{border-color:#cc113330;background:#cc113308;}
.elbl{font-family:var(--mono);font-size:.5rem;color:var(--textlo);}
.eprice{font-family:var(--mono);font-size:.82rem;font-weight:700;margin-top:4px;word-break:break-all;}
.ep-l{color:var(--long);}
.ep-s{color:var(--short);}
.esub{font-family:var(--mono);font-size:.46rem;color:var(--textlo);margin-top:3px;}

/* 風險兩欄 */
.risk-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:4px;}
.ritem{padding:7px 9px;background:var(--bg);border-radius:3px;border:1px solid var(--border);min-width:0;}
.rkey{font-family:var(--mono);font-size:.46rem;color:var(--textlo);line-height:1.3;}
.rval{font-family:var(--mono);font-size:.7rem;font-weight:600;margin-top:3px;word-break:break-all;}
.rv-l{color:var(--long);}
.rv-s{color:var(--short);}
.rv-n{color:var(--texthi);}

.disc{font-family:var(--mono);font-size:.46rem;color:var(--textlo);
  margin-top:8px;padding-top:7px;border-top:1px solid var(--border);line-height:1.6;}

.legend{display:flex;gap:10px;flex-wrap:wrap;padding:10px 14px;
  border-top:1px solid var(--border);background:var(--panel);
  font-size:.52rem;color:var(--textlo);font-family:var(--mono);}

/* SEARCH BAR */
.searchbar{display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--bg);border-bottom:1px solid var(--border);}
.search-input{flex:1;background:var(--bg2);border:1.5px solid var(--bdr2);
  color:var(--texthi);font-family:var(--mono);font-size:.72rem;
  padding:7px 12px;border-radius:6px;outline:none;
  transition:border-color .2s;}
.search-input:focus{border-color:var(--neu);}
.search-input::placeholder{color:var(--textlo);}
.search-clear{font-family:var(--mono);font-size:.65rem;padding:6px 12px;
  border-radius:6px;border:1px solid var(--border);background:transparent;
  color:var(--textlo);cursor:pointer;white-space:nowrap;}
.search-clear:active{background:var(--panel);}
.search-hint{font-family:var(--mono);font-size:.52rem;color:var(--textlo);white-space:nowrap;}
.leg{display:flex;align-items:center;gap:4px;}
.ldot2{width:5px;height:5px;border-radius:50%;flex-shrink:0;}

/* BTC MARKET PANEL */
.btc-panel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 14px;border-bottom:1px solid var(--border);
  background:var(--bg2);}
.btc-title{font-family:var(--mono);font-size:.56rem;color:var(--textlo);flex-shrink:0;}
.btc-stat{display:flex;align-items:center;gap:5px;}
.btc-val{font-family:var(--mono);font-size:.7rem;font-weight:700;}
.btc-badge{font-family:var(--mono);font-size:.56rem;padding:2px 8px;border-radius:3px;
  border:1px solid;font-weight:600;white-space:nowrap;}
.btc-bull{color:var(--long);border-color:#007a5250;background:#007a520d;}
.btc-bear{color:var(--short);border-color:#cc113350;background:#cc11330d;}
.btc-neu{color:var(--watch);border-color:#b86b0050;background:#b86b000d;}
.btc-warn{font-family:var(--mono);font-size:.56rem;padding:3px 10px;border-radius:3px;
  background:#cc11330d;border:1px solid #cc113340;color:var(--short);margin-left:auto;}

/* SIGNAL LIMIT BANNER */
.limit-banner{display:none;align-items:center;gap:8px;
  padding:8px 14px;background:#b86b0010;border-bottom:2px solid #b86b0050;}
.limit-banner.show{display:flex;}
.limit-icon{font-size:1rem;}
.limit-txt{font-family:var(--mono);font-size:.6rem;color:var(--watch);flex:1;line-height:1.5;}
.limit-count{font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--watch);}

/* GRADE BADGE on card */
.grade{display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;
  font-family:var(--mono);font-size:.68rem;font-weight:700;border:2px solid;flex-shrink:0;}
.grade-a{color:var(--long);border-color:var(--long);background:#007a5215;}
.grade-b{color:var(--neu);border-color:var(--neu);background:#1a5fc815;}
.grade-c{color:var(--watch);border-color:var(--watch);background:#b86b0015;}

/* CORRELATION WARNING on card */
.corr-warn{font-family:var(--mono);font-size:.5rem;padding:2px 8px;border-radius:2px;
  background:#b86b0010;border:1px solid #b86b0040;color:var(--watch);
  margin-top:4px;display:none;}
.corr-warn.show{display:block;}
</style>
</head>
<body>

<header>
  <div class="hlogo">BINANCE<em>/</em>FUTURES<em>/</em>PRO</div>
  <div class="hticker" id="tickerScroll">—</div>
  <div class="hlive">
    <div class="ldot" id="liveDot"></div>
    <div class="ltxt" id="liveTxt">OFFLINE</div>
  </div>
</header>

<div class="tabs">
  <button class="tab t-all on" onclick="setTab('all',this)">◈ 全部</button>
  <button class="tab t-long"   onclick="setTab('long',this)">▲ 做多</button>
  <button class="tab t-short"  onclick="setTab('short',this)">▼ 做空</button>
  <button class="tab t-watch"  onclick="setTab('watch',this)">◉ 觀察</button>
</div>

<div class="scanbar">
  <span class="sb-label">時框</span>
  <select id="tfSel">
    <option value="15m">15m</option>
    <option value="1h" selected>1H</option>
    <option value="4h">4H</option>
    <option value="1d">1D</option>
  </select>
  <span class="sb-label">幣種</span>
  <select id="topN">
    <option value="30">前30</option>
    <option value="60">前60</option>
    <option value="100" selected>前100</option>
    <option value="9999">全部合約</option>
  </select>
  <div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>
  <span class="prog-txt" id="progTxt">—</span>
  <button class="scan-btn" id="scanBtn" onclick="startScan()">⟳ 掃描</button>
</div>

<div class="statrow">
  <div class="sc"><div class="sc-val c-long"  id="st0">—</div><div class="sc-lbl">▲ 做多</div></div>
  <div class="sc"><div class="sc-val c-short" id="st1">—</div><div class="sc-lbl">▼ 做空</div></div>
  <div class="sc"><div class="sc-val c-watch" id="st2">—</div><div class="sc-lbl">◉ 觀察</div></div>
  <div class="sc"><div class="sc-val c-long"  id="st3">—</div><div class="sc-lbl">EMA雙上</div></div>
  <div class="sc"><div class="sc-val" id="st4" style="color:var(--texthi)">—</div><div class="sc-lbl">掃描總計</div></div>
  <div class="sc"><div class="sc-val" id="st5" style="color:var(--text);font-size:.95rem;">—</div><div class="sc-lbl">平均RSI</div></div>
</div>

<div class="errbox" id="errbox"></div>
<div class="ts" id="tsLine"></div>

<!-- BTC 大盤狀態 -->
<div class="btc-panel" id="btcPanel" style="display:none">
  <span class="btc-title">BTC 大盤：</span>
  <div class="btc-stat">
    <span class="btc-val" id="btcPrice">—</span>
    <span class="btc-val" id="btcChg" style="font-size:.65rem">—</span>
  </div>
  <span class="btc-badge" id="btcBadge">—</span>
  <span class="btc-badge" id="btcEma">—</span>
  <span class="btc-warn" id="btcWarn" style="display:none">⚠ 大盤空頭，慎開多單</span>
</div>

<!-- 開單上限提醒 -->
<div class="limit-banner" id="limitBanner">
  <span class="limit-icon">⚠</span>
  <span class="limit-txt">目前 A/B 級信號數量較多，建議<strong>最多只選 3 個</strong>幣種開單，避免同時持倉過多。</span>
  <span class="limit-count" id="limitCount">0</span>
</div>

<div class="sortbar">
  <span class="sort-lbl">排序：</span>
  <button class="sort-btn active" data-key="score" onclick="setSortKey('score',this)">評分 ↓</button>
  <button class="sort-btn" data-key="rsi" onclick="setSortKey('rsi',this)">RSI</button>
  <button class="sort-btn" data-key="chg" onclick="setSortKey('chg',this)">漲跌%</button>
  <button class="sort-btn" data-key="volRatio" onclick="setSortKey('volRatio',this)">量比</button>
  <button class="sort-btn" data-key="funding" onclick="setSortKey('funding',this)">資費率</button>
  <button class="sort-btn" data-key="emaScore" onclick="setSortKey('emaScore',this)">EMA強度</button>
</div>

<div class="gradebar">
  <span class="gf-lbl">評級：</span>
  <button class="gf-btn gf-on-all" onclick="setGradeFilter('all',this)">全部</button>
  <button class="gf-btn" onclick="setGradeFilter('A',this)">🟢 A級 僅精選</button>
  <button class="gf-btn" onclick="setGradeFilter('B',this)">🔵 B級以上</button>
  <button class="gf-btn" onclick="setGradeFilter('C',this)">🟡 C級（觀察）</button>
</div>

<div class="emabar">
  <span class="ema-flbl">EMA篩選：</span>
  <button class="ema-fbtn ef-all"     onclick="setEmaFilter('all',this)">全部</button>
  <button class="ema-fbtn"            onclick="setEmaFilter('above_both',this)">↑ EMA99&200上方</button>
  <button class="ema-fbtn"            onclick="setEmaFilter('below_both',this)">↓ EMA99&200下方</button>
  <button class="ema-fbtn"            onclick="setEmaFilter('above99',this)">↑ EMA99上方</button>
  <button class="ema-fbtn"            onclick="setEmaFilter('below99',this)">↓ EMA99下方</button>
  <button class="ema-fbtn"            onclick="setEmaFilter('above200',this)">↑ EMA200上方</button>
  <button class="ema-fbtn"            onclick="setEmaFilter('below200',this)">↓ EMA200下方</button>
  <button class="ema-fbtn"            onclick="setEmaFilter('between',this)">⇔ 夾在之間</button>
</div>

<div class="searchbar">
  <input class="search-input" id="searchInput" type="text"
    placeholder="搜尋幣種，例如 BTC ETH SOL…"
    oninput="onSearch(this.value)"
    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <button class="search-clear" onclick="clearSearch()">✕ 清除</button>
</div>

<div class="cardlist" id="cardlist">
  <div class="load-state">按「掃描」載入數據...</div>
</div>

<div class="legend">
  <div class="leg"><div class="ldot2" style="background:var(--long)"></div>價格在EMA99&200上方 = 強多頭</div>
  <div class="leg"><div class="ldot2" style="background:var(--short)"></div>價格在EMA99&200下方 = 強空頭</div>
  <div class="leg"><div class="ldot2" style="background:var(--watch)"></div>夾在EMA之間 = 震盪</div>
  <div class="leg">⚠ 僅供參考，非投資建議</div>
</div>

<script>
const API='https://fapi.binance.com';
const BATCH=5;
let allData=[],curTab='all',sortKey='score',sortDir=-1,emaFilter='all',searchQuery='',gradeFilter='all';
let btcTrend='neutral'; // 'bull' | 'bear' | 'neutral'

// 排除穩定幣、美股代幣、金屬代幣
const EXCLUDE_EXACT=[
  // 穩定幣
  'USDC','USDD','USDP','TUSD','BUSD','DAI','FRAX','LUSD','GUSD','FDUSD','PYUSD','EURC','EURS','EURT',
  // 美股代幣
  'AAPL','TSLA','AMZN','GOOGL','MSFT','NVDA','META','NFLX','BABA','UBER','COIN','PYPL',
  'AMD','INTC','BIDU','JNJ','JPM','BAC','WMT','DIS','V','ABNB','PLTR','HOOD',
  // 金屬代幣
  'XAU','XAG','XPT','XPD','GOLD','SILVER','PAXG','XAUT','CACHE'
];

async function startScan(){
  const btn=document.getElementById('scanBtn');
  const tf=document.getElementById('tfSel').value;
  const topN=parseInt(document.getElementById('topN').value);
  btn.disabled=true;btn.textContent='掃描中…';
  setLive('SCANNING','var(--neu)');hideErr();showLoad();setProgress(0,'準備…');
  try{
    const [tickers,fundingArr]=await Promise.all([
      fetchJ(`${API}/fapi/v1/ticker/24hr`),
      fetchJ(`${API}/fapi/v1/premiumIndex`)
    ]);

    // ── BTC 大盤分析 ──
    await analyzeBTC(tf);

    let usdtT=tickers.filter(t=>{
      if(!t.symbol.endsWith('USDT')) return false;
      const base=t.symbol.replace('USDT','');
      if(EXCLUDE_EXACT.includes(base)) return false;
      return true;
    }).sort((a,b)=>parseFloat(b.quoteVolume)-parseFloat(a.quoteVolume));
    if(topN<9999)usdtT=usdtT.slice(0,topN);
    const fundMap={};
    fundingArr.forEach(f=>{fundMap[f.symbol]=parseFloat(f.lastFundingRate)*100;});
    const results=[];
    for(let i=0;i<usdtT.length;i+=BATCH){
      const batch=usdtT.slice(i,i+BATCH);
      const settled=await Promise.allSettled(batch.map(t=>analyzeOne(t,fundMap,tf)));
      settled.forEach(r=>{if(r.status==='fulfilled'&&r.value)results.push(r.value);});
      const done=Math.min(i+BATCH,usdtT.length);
      setProgress(done/usdtT.length*100,`${done}/${usdtT.length}`);
    }
    allData=results;
    renderCards();updateStats();updateTicker();updateLimitBanner();
    document.getElementById('tsLine').textContent='最後更新：'+new Date().toLocaleString('zh-TW');
    setLive('LIVE','var(--long)');
  }catch(e){showErr('掃描失敗：'+e.message);setLive('ERROR','var(--short)');}
  btn.disabled=false;btn.textContent='⟳ 重新掃描';setProgress(100,'完成');
}

// ── BTC 大盤分析 ──
async function analyzeBTC(tf){
  try{
    const klines=await fetchJ(`${API}/fapi/v1/klines?symbol=BTCUSDT&interval=${tf}&limit=210`);
    const closes=klines.map(k=>parseFloat(k[4]));
    const price=closes[closes.length-1];
    const ema99arr=calcEMA(closes,99);
    const ema200arr=calcEMA(closes,200);
    const ema99=ema99arr[ema99arr.length-1];
    const ema200=ema200arr[ema200arr.length-1];
    const chg24=((price-closes[closes.length-24])/closes[closes.length-24]*100);

    const aboveE99=price>ema99, aboveE200=price>ema200;
    if(aboveE99&&aboveE200) btcTrend='bull';
    else if(!aboveE99&&!aboveE200) btcTrend='bear';
    else btcTrend='neutral';

    // Update UI
    const panel=document.getElementById('btcPanel');
    panel.style.display='flex';
    document.getElementById('btcPrice').textContent=fmtP(price);
    const chgEl=document.getElementById('btcChg');
    chgEl.textContent=(chg24>=0?'+':'')+chg24.toFixed(2)+'%';
    chgEl.style.color=chg24>=0?'var(--long)':'var(--short)';

    const badge=document.getElementById('btcBadge');
    if(btcTrend==='bull'){badge.textContent='多頭趨勢 ▲';badge.className='btc-badge btc-bull';}
    else if(btcTrend==='bear'){badge.textContent='空頭趨勢 ▼';badge.className='btc-badge btc-bear';}
    else{badge.textContent='震盪中 ⇔';badge.className='btc-badge btc-neu';}

    const emaEl=document.getElementById('btcEma');
    emaEl.textContent=`EMA99:${aboveE99?'↑':'↓'} EMA200:${aboveE200?'↑':'↓'}`;
    emaEl.className='btc-badge '+(aboveE99&&aboveE200?'btc-bull':!aboveE99&&!aboveE200?'btc-bear':'btc-neu');

    const warn=document.getElementById('btcWarn');
    warn.style.display=btcTrend==='bear'?'inline-flex':'none';
  }catch(e){console.warn('BTC fetch failed',e);}
}

// ── 評級計算 ──
function calcGrade(score,signal,btcOk){
  // btcOk: 信號方向與BTC趨勢一致
  if(score>=70&&btcOk) return'A';
  if(score>=55) return'B';
  return'C';
}

// ── 相關性警告 ──
// 如果同方向信號超過5個，視為高度相關
function buildCorrMap(data){
  const longs=data.filter(d=>d.signal==='long').length;
  const shorts=data.filter(d=>d.signal==='short').length;
  return{longWarn:longs>5,shortWarn:shorts>5};
}

// ── 開單上限提醒 ──
function updateLimitBanner(){
  const highGrade=allData.filter(d=>d.signal!=='none'&&d.signal!=='watch');
  const banner=document.getElementById('limitBanner');
  const count=document.getElementById('limitCount');
  if(highGrade.length>3){
    banner.classList.add('show');
    count.textContent=highGrade.length+'個信號';
  }else{
    banner.classList.remove('show');
  }
}

async function analyzeOne(ticker,fundMap,tf){
  const sym=ticker.symbol;
  const price=parseFloat(ticker.lastPrice);
  const chg=parseFloat(ticker.priceChangePercent);

  // 需要210根計算EMA200
  const klines=await fetchJ(`${API}/fapi/v1/klines?symbol=${sym}&interval=${tf}&limit=210`);
  const closes=klines.map(k=>parseFloat(k[4]));
  const highs=klines.map(k=>parseFloat(k[2]));
  const lows=klines.map(k=>parseFloat(k[3]));
  const vols=klines.map(k=>parseFloat(k[5]));

  const rsi=calcRSI(closes,14);
  const {hist}=calcMACD(closes,12,26,9);
  const lastH=hist[hist.length-1],prevH=hist[hist.length-2];
  let macdSig=0;
  if(lastH>0&&prevH<=0)macdSig=1;
  else if(lastH<0&&prevH>=0)macdSig=-1;
  else if(lastH>0)macdSig=0.5;
  else if(lastH<0)macdSig=-0.5;

  // EMA 99 & 200
  const ema99arr=calcEMA(closes,99);
  const ema200arr=calcEMA(closes,200);
  const ema99=ema99arr[ema99arr.length-1];
  const ema200=ema200arr[ema200arr.length-1];
  const ema99prev=ema99arr[ema99arr.length-2];
  const ema200prev=ema200arr[ema200arr.length-2];
  const ema99dir=ema99>ema99prev?'up':'down';
  const ema200dir=ema200>ema200prev?'up':'down';
  const aboveEma99=price>ema99;
  const aboveEma200=price>ema200;
  const distEma99=((price-ema99)/ema99*100).toFixed(2);
  const distEma200=((price-ema200)/ema200*100).toFixed(2);

  let emaStatus;
  if(aboveEma99&&aboveEma200)emaStatus='above_both';
  else if(!aboveEma99&&!aboveEma200)emaStatus='below_both';
  else emaStatus='between';

  let emaScore=0;
  if(emaStatus==='above_both'){
    emaScore=(ema99dir==='up'&&ema200dir==='up')?25:20;
  }else if(emaStatus==='below_both'){
    emaScore=(ema99dir==='down'&&ema200dir==='down')?-25:-20;
  }else{
    emaScore=aboveEma200?5:-5;
  }

  // Breakout
  const LB=20;
  const recentHigh=Math.max(...highs.slice(-LB-1,-1));
  const recentLow=Math.min(...lows.slice(-LB-1,-1));
  const breakout=closes[closes.length-1]>recentHigh?1:closes[closes.length-1]<recentLow?-1:0;
  const supportLvl=Math.min(...lows.slice(-LB));
  const resistanceLvl=Math.max(...highs.slice(-LB));

  // 進場點位：現價回踩 0.3%
  const longEntry=+(price*0.997).toPrecision(6);
  const longStop=+(price*0.980).toPrecision(6);
  const longTP=+(longEntry+(longEntry-longStop)*2).toPrecision(6);
  const shortEntry=+(price*1.003).toPrecision(6);
  const shortStop=+(price*1.020).toPrecision(6);
  const shortTP=+(shortEntry-(shortStop-shortEntry)*2).toPrecision(6);

  const recentVol=avg(vols.slice(-3));
  const baseVol=avg(vols.slice(-22,-3));
  const volRatio=baseVol>0?recentVol/baseVol:1;
  const funding=fundMap[sym]??0;
  const oiChg=chg>0?(volRatio>1.3?1:0.3):(volRatio>1.3?-1:-0.3);
  let smartMoney=0;
  if(oiChg>0.5&&chg>1&&volRatio>1.5)smartMoney=2;
  else if(oiChg>0.3&&chg>0)smartMoney=1;
  else if(oiChg<-0.5&&chg<-1&&volRatio>1.5)smartMoney=-2;
  else if(oiChg<-0.3&&chg<0)smartMoney=-1;

  // ── 布林通道 BB(20,2) ──
  const {upper:bbUpper,mid:bbMid,lower:bbLower,bw:bbBW,pct:bbPct}=calcBB(closes,20,2);
  // bbPct: 0=下軌, 1=上軌; bw=帶寬%（越大越波動）
  let bbSig=0; // +2強多 +1偏多 -1偏空 -2強空
  if(bbPct<=0.05)      bbSig= 2; // 觸下軌
  else if(bbPct<=0.2)  bbSig= 1;
  else if(bbPct>=0.95) bbSig=-2; // 觸上軌
  else if(bbPct>=0.8)  bbSig=-1;

  // ── KDJ(9,3,3) ──
  const {K,D,J}=calcKDJ(highs,lows,closes,9,3);
  const Kprev=K[K.length-2],Dprev=D[D.length-2];
  const Klast=K[K.length-1],Dlast=D[D.length-1];
  const Jlast=J[J.length-1];
  let kdjSig=0;
  // 金叉：K從下穿越D
  if(Klast>Dlast&&Kprev<=Dprev&&Klast<50)      kdjSig= 2; // 低位金叉最強
  else if(Klast>Dlast&&Kprev<=Dprev)            kdjSig= 1;
  // 死叉：K從上穿越D
  else if(Klast<Dlast&&Kprev>=Dprev&&Klast>50) kdjSig=-2; // 高位死叉最強
  else if(Klast<Dlast&&Kprev>=Dprev)           kdjSig=-1;
  // 超賣/超買 J值
  if(Jlast<10&&kdjSig>=0)  kdjSig= Math.max(kdjSig, 1);
  if(Jlast>90&&kdjSig<=0)  kdjSig= Math.min(kdjSig,-1);

  // ── 量價分析 ──
  // 近3根K線量價關係
  const lastClose=closes[closes.length-1];
  const prevClose=closes[closes.length-2];
  const lastVol=vols[vols.length-1];
  const prevVol=vols[vols.length-2];
  const priceUp=lastClose>prevClose;
  const volUp=lastVol>prevVol;
  let vpSig=0; // 量價配合
  if(priceUp&&volUp&&volRatio>1.5)       vpSig= 2; // 量增價漲 強多
  else if(priceUp&&volUp)                vpSig= 1;
  else if(!priceUp&&volUp&&volRatio>1.5) vpSig=-2; // 量增價跌 強空
  else if(!priceUp&&volUp)              vpSig=-1;
  else if(priceUp&&!volUp)              vpSig= 0.5; // 量縮價漲 弱多
  else if(!priceUp&&!volUp)            vpSig=-0.5; // 量縮價跌 弱空

  // SCORING
  let ls=0,ss=0;
  // RSI (20分)
  if(rsi<25)ls+=20;else if(rsi<35)ls+=14;else if(rsi<45)ls+=6;
  if(rsi>75)ss+=20;else if(rsi>65)ss+=14;else if(rsi>55)ss+=6;
  // MACD (15分)
  if(macdSig>=1)ls+=15;else if(macdSig>=0.5)ls+=6;
  if(macdSig<=-1)ss+=15;else if(macdSig<=-0.5)ss+=6;
  // EMA (20分)
  if(emaScore>=25)ls+=20;else if(emaScore>=20)ls+=16;else if(emaScore>0)ls+=6;
  if(emaScore<=-25)ss+=20;else if(emaScore<=-20)ss+=16;else if(emaScore<0)ss+=6;
  // 布林通道 BB (12分)
  if(bbSig>=2)ls+=12;else if(bbSig>=1)ls+=6;
  if(bbSig<=-2)ss+=12;else if(bbSig<=-1)ss+=6;
  // KDJ (12分)
  if(kdjSig>=2)ls+=12;else if(kdjSig>=1)ls+=6;
  if(kdjSig<=-2)ss+=12;else if(kdjSig<=-1)ss+=6;
  // 量價分析 VP (10分)
  if(vpSig>=2)ls+=10;else if(vpSig>=1)ls+=5;else if(vpSig>=0.5)ls+=2;
  if(vpSig<=-2)ss+=10;else if(vpSig<=-1)ss+=5;else if(vpSig<=-0.5)ss+=2;
  // Breakout (8分)
  if(breakout===1)ls+=8;
  if(breakout===-1)ss+=8;
  // Volume ratio (6分)
  if(volRatio>3){ls+=6;ss+=6;}else if(volRatio>2){ls+=4;ss+=4;}else if(volRatio>1.5){ls+=2;ss+=2;}
  // Funding (10分)
  if(funding<-0.08)ls+=10;else if(funding<-0.03)ls+=5;
  if(funding>0.08)ss+=10;else if(funding>0.03)ss+=5;
  // Smart money (10分)
  if(smartMoney===2)ls+=10;else if(smartMoney===1)ls+=5;
  if(smartMoney===-2)ss+=10;else if(smartMoney===-1)ss+=5;

  const THRESH=42;
  let signal='none';
  if(ls>=THRESH&&ls>ss)signal='long';
  else if(ss>=THRESH&&ss>ls)signal='short';
  else if(ls>=28||ss>=28)signal='watch';

  // BTC 趨勢一致性加分
  const btcOk=(signal==='long'&&btcTrend==='bull')||(signal==='short'&&btcTrend==='bear');
  if(btcOk){if(signal==='long')ls=Math.min(ls+8,100);else if(signal==='short')ss=Math.min(ss+8,100);}

  const score=signal==='long'?ls:signal==='short'?ss:Math.max(ls,ss);
  const grade=calcGrade(score,signal,btcOk);

  return{
    symbol:sym.replace('USDT',''),rawSym:sym,
    price,chg,rsi,macdSig,breakout,volRatio,funding,
    oiChg,smartMoney,ls,ss,score,signal,emaScore,grade,btcOk,
    bbUpper,bbMid,bbLower,bbBW,bbPct,bbSig,
    Klast,Dlast,Jlast,kdjSig,vpSig,
    ema99,ema200,ema99dir,ema200dir,
    aboveEma99,aboveEma200,emaStatus,
    distEma99,distEma200,
    longEntry,longStop,longTP,
    shortEntry,shortStop,shortTP,
    supportLvl,resistanceLvl
  };
}

function calcEMA(closes,p){
  const k=2/(p+1);let e=closes[0];const out=[e];
  for(let i=1;i<closes.length;i++){e=closes[i]*k+e*(1-k);out.push(e);}
  return out;
}
function calcRSI(closes,p=14){
  if(closes.length<p+1)return 50;
  let g=0,l=0;
  for(let i=1;i<=p;i++){const d=closes[i]-closes[i-1];if(d>0)g+=d;else l+=Math.abs(d);}
  let ag=g/p,al=l/p;
  for(let i=p+1;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    ag=(ag*(p-1)+Math.max(d,0))/p;al=(al*(p-1)+Math.max(-d,0))/p;
  }
  return al===0?100:100-100/(1+ag/al);
}
function calcMACD(closes,fast=12,slow=26,sig=9){
  const ef=calcEMA(closes,fast),es=calcEMA(closes,slow);
  const ml=ef.map((v,i)=>v-es[i]);
  const sl=calcEMA(ml.slice(slow-1),sig);
  return{hist:sl.map((v,i)=>ml[slow-1+i]-v)};
}

// ── 布林通道 BB(n, multiplier) ──
function calcBB(closes,n=20,mult=2){
  const slice=closes.slice(-n);
  const mid=avg(slice);
  const variance=slice.reduce((s,v)=>s+(v-mid)**2,0)/n;
  const std=Math.sqrt(variance);
  const upper=mid+mult*std;
  const lower=mid-mult*std;
  const price=closes[closes.length-1];
  const bw=mid>0?(upper-lower)/mid*100:0; // 帶寬%
  const pct=(upper-lower)>0?(price-lower)/(upper-lower):0.5; // %B
  return{upper,mid,lower,bw:+bw.toFixed(2),pct:+pct.toFixed(3)};
}

// ── KDJ(9,3,3) ──
function calcKDJ(highs,lows,closes,n=9,m=3){
  const len=closes.length;
  const K=[],D=[],J=[];
  let prevK=50,prevD=50;
  for(let i=0;i<len;i++){
    const start=Math.max(0,i-n+1);
    const hh=Math.max(...highs.slice(start,i+1));
    const ll=Math.min(...lows.slice(start,i+1));
    const rsv=hh===ll?50:(closes[i]-ll)/(hh-ll)*100;
    const k=(prevK*(m-1)+rsv)/m;
    const d=(prevD*(m-1)+k)/m;
    const j=3*k-2*d;
    K.push(k);D.push(d);J.push(j);
    prevK=k;prevD=d;
  }
  return{K,D,J};
}
function avg(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;}
function fmtP(p){
  if(isNaN(p)||p===null)return'—';
  if(p>=10000)return p.toLocaleString('en',{minimumFractionDigits:1,maximumFractionDigits:1});
  if(p>=1000)return p.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(p>=1)return p.toFixed(4);
  if(p>=0.001)return p.toFixed(5);
  return p.toFixed(7);
}

function renderCards(){
  let data=[...allData];
  if(curTab!=='all')data=data.filter(d=>d.signal===curTab);
  // EMA filter
  if(emaFilter==='above_both') data=data.filter(d=>d.emaStatus==='above_both');
  else if(emaFilter==='below_both') data=data.filter(d=>d.emaStatus==='below_both');
  else if(emaFilter==='above99')  data=data.filter(d=>d.aboveEma99);
  else if(emaFilter==='below99')  data=data.filter(d=>!d.aboveEma99);
  else if(emaFilter==='above200') data=data.filter(d=>d.aboveEma200);
  else if(emaFilter==='below200') data=data.filter(d=>!d.aboveEma200);
  else if(emaFilter==='between')  data=data.filter(d=>d.emaStatus==='between');
  // Grade filter
  if(gradeFilter==='A') data=data.filter(d=>d.grade==='A');
  else if(gradeFilter==='B') data=data.filter(d=>d.grade==='A'||d.grade==='B');
  else if(gradeFilter==='C') data=data.filter(d=>d.grade==='C');
  // Search filter
  if(searchQuery){
    const q=searchQuery.toUpperCase().replace(/USDT$/,'');
    data=data.filter(d=>d.symbol.includes(q));
  }
  data.sort((a,b)=>sortDir*(a[sortKey]-b[sortKey]));
  const list=document.getElementById('cardlist');
  if(!data.length){list.innerHTML='<div class="empty">無符合條件的幣種</div>';return;}

  list.innerHTML=data.map((d,idx)=>{
    const rowCls=d.signal==='long'?'row-long':d.signal==='short'?'row-short':d.signal==='watch'?'row-watch':'';
    const chgStr=(d.chg>=0?'+':'')+d.chg.toFixed(2)+'%';
    const chgCls=d.chg>=0?'pos':'neg';
    let sigStr,sigCls;
    if(d.signal==='long'){sigStr='▲ 做多';sigCls='sig-long';}
    else if(d.signal==='short'){sigStr='▼ 做空';sigCls='sig-short';}
    else if(d.signal==='watch'){sigStr='◉ 觀察';sigCls='sig-watch';}
    else{sigStr='—';sigCls='sig-none';}

    // EMA pills
    const p99cls=d.aboveEma99?'ep-above':'ep-below';
    const p200cls=d.aboveEma200?'ep-above':'ep-below';
    const p99str=(d.aboveEma99?'↑':'↓')+'EMA99';
    const p200str=(d.aboveEma200?'↑':'↓')+'EMA200';
    const d99sign=parseFloat(d.distEma99)>=0?'+':'';
    const d200sign=parseFloat(d.distEma200)>=0?'+':'';

    // Chips
    const rsiCls=d.rsi<35?'chip-long':d.rsi>65?'chip-short':d.rsi<48||d.rsi>52?'chip-watch':'chip-neu';
    let macdStr,macdCls;
    if(d.macdSig>=1){macdStr='MACD金叉';macdCls='chip-long';}
    else if(d.macdSig<=-1){macdStr='MACD死叉';macdCls='chip-short';}
    else if(d.macdSig>0){macdStr='MACD多';macdCls='chip-long';}
    else if(d.macdSig<0){macdStr='MACD空';macdCls='chip-short';}
    else{macdStr='MACD中性';macdCls='chip-neu';}
    const boCls=d.breakout===1?'chip-long':d.breakout===-1?'chip-short':'chip-neu';
    const boStr=d.breakout===1?'突破▲':d.breakout===-1?'跌破▼':'區間';
    const volCls=d.volRatio>2?'chip-long':d.volRatio>1.5?'chip-watch':'chip-neu';
    const fundCls=d.funding<-0.03?'chip-long':d.funding>0.03?'chip-short':'chip-neu';
    let smStr,smCls;
    if(d.smartMoney===2){smStr='聰明錢↑↑';smCls='chip-long';}
    else if(d.smartMoney===1){smStr='聰明錢↑';smCls='chip-long';}
    else if(d.smartMoney===-2){smStr='聰明錢↓↓';smCls='chip-short';}
    else if(d.smartMoney===-1){smStr='聰明錢↓';smCls='chip-short';}
    else{smStr='聰明錢中性';smCls='chip-neu';}
    // BB chips
    let bbStr,bbCls;
    if(d.bbSig>=2){bbStr='BB觸下軌';bbCls='chip-long';}
    else if(d.bbSig>=1){bbStr='BB偏下';bbCls='chip-long';}
    else if(d.bbSig<=-2){bbStr='BB觸上軌';bbCls='chip-short';}
    else if(d.bbSig<=-1){bbStr='BB偏上';bbCls='chip-short';}
    else{bbStr='BB中軌';bbCls='chip-neu';}
    const bbPctStr=(d.bbPct*100).toFixed(0)+'%';

    // KDJ chips
    let kdjStr,kdjCls;
    if(d.kdjSig>=2){kdjStr='KDJ低位金叉';kdjCls='chip-long';}
    else if(d.kdjSig>=1){kdjStr='KDJ金叉';kdjCls='chip-long';}
    else if(d.kdjSig<=-2){kdjStr='KDJ高位死叉';kdjCls='chip-short';}
    else if(d.kdjSig<=-1){kdjStr='KDJ死叉';kdjCls='chip-short';}
    else{kdjStr=`KDJ K${d.Klast.toFixed(0)}`;kdjCls=d.Klast<30?'chip-long':d.Klast>70?'chip-short':'chip-neu';}

    // Volume chips
    let vpStr,vpCls;
    if(d.vpSig>=2){vpStr='量增價漲 ▲';vpCls='chip-long';}
    else if(d.vpSig>=1){vpStr='量價同升';vpCls='chip-long';}
    else if(d.vpSig<=-2){vpStr='量增價跌 ▼';vpCls='chip-short';}
    else if(d.vpSig<=-1){vpStr='量價背離';vpCls='chip-short';}
    else if(d.vpSig>0){vpStr='縮量上漲';vpCls='chip-watch';}
    else{vpStr='縮量下跌';vpCls='chip-watch';}

    const gfCls=d.signal==='short'?'gfill-short':d.signal==='watch'?'gfill-watch':'gfill-long';

    // Grade
    const gradeCls=d.grade==='A'?'grade-a':d.grade==='B'?'grade-b':'grade-c';

    // BTC alignment chip
    const btcChip=d.btcOk
      ?`<span class="chip chip-long">✓ 順大盤</span>`
      :(d.signal==='long'&&btcTrend==='bear'||d.signal==='short'&&btcTrend==='bull')
        ?`<span class="chip chip-short">⚠ 逆大盤</span>`:'';

    // Correlation warning
    const corrMap=buildCorrMap(allData);
    const showCorr=(d.signal==='long'&&corrMap.longWarn)||(d.signal==='short'&&corrMap.shortWarn);

    // EMA detail
    const ema99vcls=d.aboveEma99?'ev-long':'ev-short';
    const ema200vcls=d.aboveEma200?'ev-long':'ev-short';
    const ema99dircol=d.ema99dir==='up'?'var(--long)':'var(--short)';
    const ema200dircol=d.ema200dir==='up'?'var(--long)':'var(--short)';

    return`<div class="coin-card ${rowCls}" onclick="toggleCard(this)" style="animation-delay:${idx*7}ms">
      <div class="card-top">
        <div class="card-top-left">
          <span class="grade ${gradeCls}">${d.grade}</span>
          <span class="card-sym">${d.symbol}<sub>/USDT</sub></span>
          <span class="card-price">${fmtP(d.price)}</span>
          <span class="card-chg ${chgCls}">${chgStr}</span>
        </div>
        <span class="sig ${sigCls}">${sigStr}</span>
      </div>
      <div class="ema-row">
        <span class="ema-pill ${p99cls}">${p99str}</span>
        <span class="ema-pill ${p200cls}">${p200str}</span>
      </div>
      <div class="ema-dist-row">
        <span class="ema-dist-tag ${parseFloat(d.distEma99)>=0?'edt-pos':'edt-neg'}">EMA99 ${d99sign}${d.distEma99}%</span>
        <span class="ema-dist-tag ${parseFloat(d.distEma200)>=0?'edt-pos':'edt-neg'}">EMA200 ${d200sign}${d.distEma200}%</span>
      </div>
      <div class="score-row">
        <div class="gbar"><div class="gfill ${gfCls}" style="width:${Math.min(d.score,100)}%"></div></div>
        <span class="gnum">評分 ${d.score} | 多${d.ls} 空${d.ss}</span>
      </div>
      <div class="chips">
        <span class="chip ${rsiCls}">RSI ${d.rsi.toFixed(1)}</span>
        <span class="chip ${macdCls}">${macdStr}</span>
        <span class="chip ${boCls}">${boStr}</span>
        <span class="chip ${volCls}">量比 ${d.volRatio.toFixed(1)}x</span>
        <span class="chip ${fundCls}">費率 ${(d.funding>=0?'+':'')+d.funding.toFixed(4)}%</span>
        <span class="chip ${smCls}">${smStr}</span>
        ${btcChip}
      </div>
      <div class="chips" style="margin-top:4px">
        ${(()=>{
          // BB chip
          let bbStr,bbCls;
          if(d.bbSig>=2){bbStr='BB下軌触碰';bbCls='chip-long';}
          else if(d.bbSig>=1){bbStr='BB偏低';bbCls='chip-long';}
          else if(d.bbSig<=-2){bbStr='BB上軌触碰';bbCls='chip-short';}
          else if(d.bbSig<=-1){bbStr='BB偏高';bbCls='chip-short';}
          else{bbStr=`BB中軌`;bbCls='chip-neu';}
          const bbPctStr=`%B ${(d.bbPct*100).toFixed(0)}%`;
          // KDJ chip
          let kdjStr,kdjCls;
          if(d.kdjSig>=2){kdjStr='KDJ金叉↑';kdjCls='chip-long';}
          else if(d.kdjSig>=1){kdjStr='KDJ偏多';kdjCls='chip-long';}
          else if(d.kdjSig<=-2){kdjStr='KDJ死叉↓';kdjCls='chip-short';}
          else if(d.kdjSig<=-1){kdjStr='KDJ偏空';kdjCls='chip-short';}
          else{kdjStr='KDJ中性';kdjCls='chip-neu';}
          const kdjVal=`K${d.Klast.toFixed(0)} D${d.Dlast.toFixed(0)} J${d.Jlast.toFixed(0)}`;
          // VP chip
          let vpStr,vpCls;
          if(d.vpSig>=2){vpStr='量增價漲▲';vpCls='chip-long';}
          else if(d.vpSig>=1){vpStr='量價偏多';vpCls='chip-long';}
          else if(d.vpSig<=-2){vpStr='量增價跌▼';vpCls='chip-short';}
          else if(d.vpSig<=-1){vpStr='量價偏空';vpCls='chip-short';}
          else if(d.vpSig>0){vpStr='量縮價漲';vpCls='chip-watch';}
          else{vpStr='量縮價跌';vpCls='chip-watch';}
          return `<span class="chip ${bbCls}">${bbStr} ${bbPctStr}</span>
          <span class="chip ${kdjCls}">${kdjStr} ${kdjVal}</span>
          <span class="chip ${vpCls}">${vpStr}</span>`;
        })()}
      </div>
      ${showCorr?`<div class="corr-warn show">⚠ 同方向信號過多（山寨幣高度相關），建議最多只選 1-2 個</div>`:''}
      <div class="card-detail">
        <div class="dtitle">▸ 布林通道 BB(20,2)</div>
        <div class="ema-detail">
          <div class="edb">
            <div class="edb-lbl">上軌（阻力）</div>
            <div class="edb-val ev-short">${fmtP(d.bbUpper)}</div>
            <div class="edb-sub" style="color:var(--textlo)">觸碰=超買</div>
          </div>
          <div class="edb">
            <div class="edb-lbl">中軌 MA20</div>
            <div class="edb-val ev-neu">${fmtP(d.bbMid)}</div>
            <div class="edb-sub" style="color:var(--textlo)">%B: ${(d.bbPct*100).toFixed(0)}% | 帶寬: ${d.bbBW}%</div>
          </div>
          <div class="edb">
            <div class="edb-lbl">下軌（支撐）</div>
            <div class="edb-val ev-long">${fmtP(d.bbLower)}</div>
            <div class="edb-sub" style="color:var(--textlo)">觸碰=超賣</div>
          </div>
        </div>
        <div class="dtitle">▸ KDJ(9,3,3)</div>
        <div class="ema-detail">
          <div class="edb">
            <div class="edb-lbl">K 值</div>
            <div class="edb-val ${d.Klast<30?'ev-long':d.Klast>70?'ev-short':'ev-neu'}">${d.Klast.toFixed(1)}</div>
            <div class="edb-sub" style="color:var(--textlo)">${d.Klast<30?'⬇ 超賣區':d.Klast>70?'⬆ 超買區':'中性區'}</div>
          </div>
          <div class="edb">
            <div class="edb-lbl">D 值</div>
            <div class="edb-val ${d.Dlast<30?'ev-long':d.Dlast>70?'ev-short':'ev-neu'}">${d.Dlast.toFixed(1)}</div>
            <div class="edb-sub" style="color:var(--textlo)">${d.Klast>d.Dlast?'K>D 金叉趨勢':'K<D 死叉趨勢'}</div>
          </div>
          <div class="edb">
            <div class="edb-lbl">J 值（敏感）</div>
            <div class="edb-val ${d.Jlast<10?'ev-long':d.Jlast>90?'ev-short':'ev-neu'}">${d.Jlast.toFixed(1)}</div>
            <div class="edb-sub" style="color:var(--textlo)">${d.Jlast<10?'極超賣 強反彈':d.Jlast>90?'極超買 危險':d.Jlast<30?'偏超賣':d.Jlast>70?'偏超買':'正常'}</div>
          </div>
        </div>
        <div class="dtitle">▸ 成交量分析</div>
        <div class="risk-grid" style="margin-bottom:8px">
          <div class="ritem"><div class="rkey">量比（近3根/前均）</div><div class="rval ${d.volRatio>2?'rv-l':d.volRatio<0.5?'rv-s':'rv-n'}">${d.volRatio.toFixed(2)}x ${d.volRatio>2?'放量':d.volRatio<0.8?'縮量':'正常'}</div></div>
          <div class="ritem"><div class="rkey">量價關係</div><div class="rval ${d.vpSig>=1?'rv-l':d.vpSig<=-1?'rv-s':'rv-n'}">${d.vpSig>=2?'量增價漲 強多':d.vpSig>=1?'量價同升':d.vpSig<=-2?'量增價跌 強空':d.vpSig<=-1?'量增價跌':'量縮震盪'}</div></div>
          <div class="ritem"><div class="rkey">資金費率</div><div class="rval ${d.funding<-0.03?'rv-l':d.funding>0.03?'rv-s':'rv-n'}">${(d.funding>=0?'+':'')+d.funding.toFixed(4)}%</div></div>
          <div class="ritem"><div class="rkey">聰明錢方向</div><div class="rval ${d.smartMoney>0?'rv-l':d.smartMoney<0?'rv-s':'rv-n'}">${d.smartMoney>=2?'強多↑↑':d.smartMoney===1?'偏多↑':d.smartMoney<=-2?'強空↓↓':d.smartMoney===-1?'偏空↓':'中性'}</div></div>
        </div>
        <div class="dtitle">▸ EMA 趨勢詳情</div>
        <div class="ema-detail">
          <div class="edb">
            <div class="edb-lbl">現價</div>
            <div class="edb-val ev-neu">${fmtP(d.price)}</div>
            <div class="edb-sub" style="color:var(--textlo)">基準</div>
          </div>
          <div class="edb">
            <div class="edb-lbl">EMA 99</div>
            <div class="edb-val ${ema99vcls}">${fmtP(d.ema99)}</div>
            <div class="edb-sub" style="color:${ema99dircol}">${d.ema99dir==='up'?'↑ 向上':'↓ 向下'} | 價格${d.aboveEma99?'上方':'下方'}</div>
          </div>
          <div class="edb">
            <div class="edb-lbl">EMA 200</div>
            <div class="edb-val ${ema200vcls}">${fmtP(d.ema200)}</div>
            <div class="edb-sub" style="color:${ema200dircol}">${d.ema200dir==='up'?'↑ 向上':'↓ 向下'} | 價格${d.aboveEma200?'上方':'下方'}</div>
          </div>
        </div>
        <div class="dtitle">▸ 布林通道 / KDJ / 量價</div>
        <div class="risk-grid" style="margin-bottom:8px">
          <div class="ritem"><div class="rkey">BB 上軌</div><div class="rval rv-s">${fmtP(d.bbUpper)}</div></div>
          <div class="ritem"><div class="rkey">BB 中軌</div><div class="rval rv-n">${fmtP(d.bbMid)}</div></div>
          <div class="ritem"><div class="rkey">BB 下軌</div><div class="rval rv-l">${fmtP(d.bbLower)}</div></div>
          <div class="ritem"><div class="rkey">BB 帶寬%</div><div class="rval rv-n">${d.bbBW}%</div></div>
          <div class="ritem"><div class="rkey">KDJ · K值</div><div class="rval ${d.Klast>d.Dlast?'rv-l':'rv-s'}">${d.Klast.toFixed(1)}</div></div>
          <div class="ritem"><div class="rkey">KDJ · D值</div><div class="rval rv-n">${d.Dlast.toFixed(1)}</div></div>
          <div class="ritem"><div class="rkey">KDJ · J值</div><div class="rval ${d.Jlast<20?'rv-l':d.Jlast>80?'rv-s':'rv-n'}">${d.Jlast.toFixed(1)}</div></div>
          <div class="ritem"><div class="rkey">量比</div><div class="rval ${d.volRatio>2?'rv-l':'rv-n'}">${d.volRatio.toFixed(2)}x</div></div>
        </div>
        <div class="dtitle">▸ 進場點位（現價回踩 0.3%）</div>
        <div class="entry-grid">
          <div class="ebox ebox-l">
            <div class="elbl">做多進場</div>
            <div class="eprice ep-l">${fmtP(d.longEntry)}</div>
            <div class="esub">現價 −0.3%</div>
          </div>
          <div class="ebox ebox-s">
            <div class="elbl">做空進場</div>
            <div class="eprice ep-s">${fmtP(d.shortEntry)}</div>
            <div class="esub">現價 +0.3%</div>
          </div>
        </div>
        <div class="dtitle">▸ 止損 / 止盈（1:2 盈虧比）</div>
        <div class="risk-grid">
          <div class="ritem"><div class="rkey">做多止損 SL</div><div class="rval rv-s">${fmtP(d.longStop)}</div></div>
          <div class="ritem"><div class="rkey">做多止盈 TP</div><div class="rval rv-l">${fmtP(d.longTP)}</div></div>
          <div class="ritem"><div class="rkey">做空止損 SL</div><div class="rval rv-s">${fmtP(d.shortStop)}</div></div>
          <div class="ritem"><div class="rkey">做空止盈 TP</div><div class="rval rv-l">${fmtP(d.shortTP)}</div></div>
          <div class="ritem"><div class="rkey">支撐位</div><div class="rval rv-n">${fmtP(d.supportLvl)}</div></div>
          <div class="ritem"><div class="rkey">阻力位</div><div class="rval rv-n">${fmtP(d.resistanceLvl)}</div></div>
        </div>
        <div class="disc">⚠ 進場點位為現價±0.3%，EMA由幣安K線即時計算。此工具僅供參考，不構成投資建議，請自行評估風險。</div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(el){el.classList.toggle('expanded');}

function updateStats(){
  document.getElementById('st0').textContent=allData.filter(d=>d.signal==='long').length;
  document.getElementById('st1').textContent=allData.filter(d=>d.signal==='short').length;
  document.getElementById('st2').textContent=allData.filter(d=>d.signal==='watch').length;
  document.getElementById('st3').textContent=allData.filter(d=>d.emaStatus==='above_both').length;
  document.getElementById('st4').textContent=allData.length;
  document.getElementById('st5').textContent=avg(allData.map(d=>d.rsi)).toFixed(1);
}

function updateTicker(){
  const top=[...allData].sort((a,b)=>b.score-a.score).slice(0,8);
  document.getElementById('tickerScroll').textContent=
    top.map(d=>`${d.symbol} ${d.chg>=0?'▲':'▼'}${Math.abs(d.chg).toFixed(1)}%`).join('  ·  ');
}

function setGradeFilter(g,el){
  gradeFilter=g;
  document.querySelectorAll('.gf-btn').forEach(b=>b.className='gf-btn');
  const cls=g==='A'?'gf-on-a':g==='B'?'gf-on-b':g==='C'?'gf-on-c':'gf-on-all';
  el.classList.add(cls);
  renderCards();
}
function onSearch(val){
  searchQuery=val.trim();
  // 若搜尋時資料還沒載入，直接跳過
  if(!allData.length) return;
  renderCards();
}
function clearSearch(){
  searchQuery='';
  document.getElementById('searchInput').value='';
  renderCards();
}
function setEmaFilter(f,el){
  emaFilter=f;
  document.querySelectorAll('.ema-fbtn').forEach(b=>{
    b.className='ema-fbtn';
    if(f==='above_both'||f==='above99'||f==='above200') b===el&&b.classList.add('ef-above');
    else if(f==='below_both'||f==='below99'||f==='below200') b===el&&b.classList.add('ef-below');
    else if(f==='between') b===el&&b.classList.add('ef-between');
    else if(f==='all') b===el&&b.classList.add('ef-all');
  });
  renderCards();
}
function setTab(t,el){
  curTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');renderCards();
}
const SORT_LABELS={'score':'評分','rsi':'RSI','chg':'漲跌%','volRatio':'量比','funding':'資費率','emaScore':'EMA強度'};
function setSortKey(key,el){
  if(sortKey===key) sortDir*=-1;
  else{sortKey=key;sortDir=-1;}
  document.querySelectorAll('.sort-btn').forEach(b=>{
    b.classList.remove('active');
    const k=b.getAttribute('data-key');
    if(k) b.textContent=SORT_LABELS[k]||k;
  });
  el.classList.add('active');
  el.textContent=(SORT_LABELS[key]||key)+(sortDir===-1?' ↓':' ↑');
  renderCards();
}
function setLive(txt,color){
  document.getElementById('liveTxt').textContent=txt;
  const d=document.getElementById('liveDot');
  d.style.background=color;d.style.boxShadow=`0 0 8px ${color}`;
}
function setProgress(pct,txt){
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progTxt').textContent=txt;
}
function showLoad(){
  document.getElementById('cardlist').innerHTML='<div class="load-state"><span class="spin">◌</span>掃描中，請稍候…</div>';
}
function showErr(msg){const b=document.getElementById('errbox');b.style.display='block';b.textContent=msg;}
function hideErr(){document.getElementById('errbox').style.display='none';}
async function fetchJ(url){const r=await fetch(url);if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}
</script>
</body>
</html>
